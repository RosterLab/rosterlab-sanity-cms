<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 132" width="520" height="264">
<!-- rl-keyframes-injected -->
<style>
    @keyframes rlArrive {
      0%, 20%   { opacity: 0; transform: translateY(-6px); }
      45%, 90%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; transform: translateY(-6px); }
    }
  

    @keyframes rlMove {
      0%, 20%   { transform: translate(0, 0); opacity: 1; }
      45%, 90%  { transform: translate(56px, -26px); opacity: 1; }
      100%      { transform: translate(0, 0); opacity: 1; }
    }
  
    svg [style*="animation"] {
      transform-box: fill-box;
      transform-origin: center;
      animation-play-state: var(--rl-play, paused) !important;
    }
  </style>
<rect x="40" y="22" width="188" height="92" rx="13" fill="#2D3BEA" fill-opacity=".05"></rect>
        <rect x="36" y="18" width="188" height="92" rx="13" fill="#FFFFFF" stroke="#2D3BEA" stroke-opacity=".35"></rect>
        <g fill="#2D3BEA">
          <rect x="52" y="36" width="44" height="12" rx="3" fill-opacity=".8"></rect><rect x="108" y="36" width="44" height="12" rx="3" fill-opacity=".14"></rect>
          <rect x="52" y="62" width="44" height="12" rx="3" fill-opacity=".14"></rect><rect x="164" y="62" width="44" height="12" rx="3" fill-opacity=".14"></rect>
          <rect x="52" y="88" width="44" height="12" rx="3" fill-opacity=".8"></rect><rect x="108" y="88" width="44" height="12" rx="3" fill-opacity=".14"></rect><rect x="164" y="88" width="44" height="12" rx="3" fill-opacity=".8"></rect>
        </g>
        <rect x="108" y="62" width="44" height="12" rx="3" fill="none" stroke="#2D3BEA" stroke-opacity=".5" stroke-dasharray="3 3"></rect>
        <rect x="164" y="36" width="44" height="12" rx="3" fill="none" stroke="#2D3BEA" stroke-opacity=".5" stroke-dasharray="3 3"></rect>
        <rect x="164" y="36" width="44" height="12" rx="3" fill="#03F9BE" style="animation:rlArrive 3.6s cubic-bezier(.65,0,.35,1) infinite"></rect>
        <rect x="108" y="62" width="44" height="12" rx="3" fill="#2D3BEA" fill-opacity=".75" style="animation:rlMove 3.6s cubic-bezier(.65,0,.35,1) infinite"></rect>
        <path d="M133 60c2-12 12-17 23-18" fill="none" stroke="#2D3BEA" stroke-opacity=".6" stroke-width="2.2" stroke-linecap="round"></path>
