<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 132" width="520" height="264">
<!-- rl-keyframes-injected -->
<style>
    @keyframes rlDash {
      to { stroke-dashoffset: -48; }
    }
  

    @keyframes rlPulse {
      0%, 100% { opacity: 0.4; transform: scale(1);    }
      50%      { opacity: 1;   transform: scale(1.04); }
    }
  
    svg [style*="animation"] {
      transform-box: fill-box;
      transform-origin: center;
      animation-play-state: var(--rl-play, paused) !important;
    }
  </style>
