name: Refresh market access policy

on:
  schedule:
    - cron: "0 3 10 7 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-market-access-policy.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-market-access-policy
          delete-branch: true
          commit-message: "chore: refresh market access policy"
          title: "chore: refresh annual market access policy"
          body: |
            Automated World Bank income-group and Atlas GNI refresh.

            Review `lib/market-access/data/policy-current.json` for countries crossing the free-signup or live-demo thresholds before merging.
