name: Verify

# Catches stale generated US resource files on the pull request instead of at
# deploy time. This check used to run as `prebuild`, where a failure stopped
# `next build` and took the Netlify deploy down with it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: US resource files are up to date
        run: pnpm localize:resources:check

      - name: Tests
        run: pnpm test
